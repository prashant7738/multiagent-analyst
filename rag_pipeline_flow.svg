<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1022" viewBox="0 0 680 1022" role="img">
<title>How the dataset chat (RAG) works</title>
<desc>Two phases: build the index once per dataset (sample rows and facts, embed with a Hugging Face model, store in Postgres/pgvector), then answer every question (embed question, vector search plus deterministic query engine, grounded context to an LLM with a rule-based fallback, reply saved to the transcript).</desc>
<style>
  text{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
  .th{font-size:14px;font-weight:500}
  .ts{font-size:12px;font-weight:400}
  .gray rect{fill:#F1EFE8;stroke:#5F5E5A}
  .gray .th{fill:#2C2C2A}.gray .ts{fill:#5F5E5A}
  .teal rect{fill:#E1F5EE;stroke:#0F6E56}
  .teal .th{fill:#04342C}.teal .ts{fill:#0F6E56}
  .purple rect{fill:#EEEDFE;stroke:#534AB7}
  .purple .th{fill:#26215C}.purple .ts{fill:#534AB7}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="1022" fill="#ffffff"/>

<g class="gray"><rect x="70" y="20" width="540" height="28" rx="6" stroke-width="0.5"/><text class="th" x="340" y="34" text-anchor="middle" dominant-baseline="central">Build the index &#183; runs once per dataset</text></g>

<g class="gray"><rect x="190" y="68" width="300" height="52" rx="8" stroke-width="0.5"/><text class="th" x="340" y="87" text-anchor="middle" dominant-baseline="central">Cleaned dataset</text><text class="ts" x="340" y="105" text-anchor="middle" dominant-baseline="central">rows plus computed facts</text></g>
<line x1="340" y1="120" x2="340" y2="144" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="gray"><rect x="190" y="144" width="300" height="52" rx="8" stroke-width="0.5"/><text class="th" x="340" y="163" text-anchor="middle" dominant-baseline="central">Sample and chunk rows</text><text class="ts" x="340" y="181" text-anchor="middle" dominant-baseline="central">capped at RAG_MAX_ROWS</text></g>
<line x1="340" y1="196" x2="340" y2="220" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="gray"><rect x="190" y="220" width="300" height="52" rx="8" stroke-width="0.5"/><text class="th" x="340" y="239" text-anchor="middle" dominant-baseline="central">Build documents</text><text class="ts" x="340" y="257" text-anchor="middle" dominant-baseline="central">one per row, one per fact</text></g>
<line x1="340" y1="272" x2="340" y2="296" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="gray"><rect x="190" y="296" width="300" height="52" rx="8" stroke-width="0.5"/><text class="th" x="340" y="315" text-anchor="middle" dominant-baseline="central">Embed each document</text><text class="ts" x="340" y="333" text-anchor="middle" dominant-baseline="central">Hugging Face bge-base, 768-dim</text></g>
<line x1="340" y1="348" x2="340" y2="372" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="teal"><rect x="190" y="372" width="300" height="52" rx="8" stroke-width="0.5"/><text class="th" x="340" y="391" text-anchor="middle" dominant-baseline="central">Postgres with pgvector</text><text class="ts" x="340" y="409" text-anchor="middle" dominant-baseline="central">table: dataset_embeddings</text></g>

<g class="gray"><rect x="70" y="452" width="540" height="28" rx="6" stroke-width="0.5"/><text class="th" x="340" y="466" text-anchor="middle" dominant-baseline="central">Answer a question &#183; runs every message</text></g>

<g class="gray"><rect x="190" y="500" width="300" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="522" text-anchor="middle" dominant-baseline="central">User question</text></g>
<line x1="340" y1="544" x2="340" y2="568" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="gray"><rect x="190" y="568" width="300" height="52" rx="8" stroke-width="0.5"/><text class="th" x="340" y="587" text-anchor="middle" dominant-baseline="central">Embed the question</text><text class="ts" x="340" y="605" text-anchor="middle" dominant-baseline="central">same bge-base model</text></g>

<path d="M340 620 L340 642 L185 642 L185 660" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 620 L340 642 L495 642 L495 660" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="purple"><rect x="50" y="660" width="270" height="52" rx="8" stroke-width="0.5"/><text class="th" x="185" y="679" text-anchor="middle" dominant-baseline="central">Vector search</text><text class="ts" x="185" y="697" text-anchor="middle" dominant-baseline="central">top-K similar rows and facts</text></g>
<g class="purple"><rect x="360" y="660" width="270" height="52" rx="8" stroke-width="0.5"/><text class="th" x="495" y="679" text-anchor="middle" dominant-baseline="central">Query engine</text><text class="ts" x="495" y="697" text-anchor="middle" dominant-baseline="central">exact counts, sums, filters</text></g>

<path d="M190 398 L42 398 L42 686 L50 686" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

<path d="M185 712 L185 734 L334 734 L334 752" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M495 712 L495 734 L346 734 L346 752" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="purple"><rect x="190" y="752" width="300" height="52" rx="8" stroke-width="0.5"/><text class="th" x="340" y="771" text-anchor="middle" dominant-baseline="central">Grounded context</text><text class="ts" x="340" y="789" text-anchor="middle" dominant-baseline="central">only retrieved facts and numbers</text></g>
<line x1="340" y1="804" x2="340" y2="828" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="purple"><rect x="190" y="828" width="300" height="52" rx="8" stroke-width="0.5"/><text class="th" x="340" y="847" text-anchor="middle" dominant-baseline="central">Generate the answer</text><text class="ts" x="340" y="865" text-anchor="middle" dominant-baseline="central">Groq or Gemini, else rule-based</text></g>
<line x1="340" y1="880" x2="340" y2="904" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="gray"><rect x="190" y="904" width="300" height="52" rx="8" stroke-width="0.5"/><text class="th" x="340" y="923" text-anchor="middle" dominant-baseline="central">Reply, with optional chart</text><text class="ts" x="340" y="941" text-anchor="middle" dominant-baseline="central">saved to the chat transcript</text></g>

<g class="gray"><rect x="70" y="976" width="540" height="26" rx="6" stroke-width="0.5"/><text class="ts" x="340" y="990" text-anchor="middle" dominant-baseline="central">grey = pipeline step &#183; teal = stored index &#183; purple = retrieval and answer</text></g>
</svg>
