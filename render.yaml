services:
  - name: multiagent-analyst-api
    type: web
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      # The database lives on Supabase, not Render (see DEPLOYMENT.md) — paste
      # your Supabase project's connection string here via the Render
      # dashboard after the first deploy. Never committed to the repo.
      - key: DATABASE_URL
        sync: false
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      # Secrets — fill these in via the Render dashboard after the first
      # deploy (never committed to the repo). See DEPLOYMENT.md.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      # Tighten this to your exact Vercel URL once the frontend is deployed
      # (e.g. "https://your-app.vercel.app") — see DEPLOYMENT.md.
      - key: API_CORS_ORIGINS
        value: "*"
      - key: API_LOG_LEVEL
        value: info
      - key: PYTHON_VERSION
        value: "3.12.7"
